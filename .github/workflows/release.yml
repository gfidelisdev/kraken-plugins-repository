name: Release Kraken Plugins Repository

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies and build static catalog
        run: |
          npm ci
          npm run build

      - name: Create Release Archive
        run: |
          tar -czf kraken-plugins-catalog-${{ github.ref_name }}.tar.gz -C public index.json
          zip -j kraken-plugins-catalog-${{ github.ref_name }}.zip public/index.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            public/index.json
            kraken-plugins-catalog-${{ github.ref_name }}.zip
            kraken-plugins-catalog-${{ github.ref_name }}.tar.gz
